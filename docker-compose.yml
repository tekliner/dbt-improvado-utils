services:
  dbt:
    container_name: dbt
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - app
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ['sleep', 'infinity']

  clickhouse:
    container_name: dbt_clickhouse
    image: clickhouse/clickhouse-server:26.3.17.56  # lisbon palantir version
    environment:
      - CLICKHOUSE_USER=$CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
    volumes:
      - ./tests/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    # the embedded Keeper makes the server take a few seconds longer to accept connections;
    # `docker compose up -d` waits for this before starting dbt, so pytest never runs early
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" -q "select 1"']
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - app

networks:
  app:
    driver: bridge
